spring.application.name=youth-housing

# Oracle connection values are injected from the local .env file or environment variables.
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# The schema is managed through SQL migrations, never generated from entities automatically.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.data.jpa.repositories.enabled=false

# JWT secrets must be supplied at runtime and never committed to Git.
jwt.secret=${JWT_SECRET}

# File upload limits for contract and supporting-document reviews.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# Official policy APIs. Keys stay on the server; never use VITE_ variables for these.
policy.youth.api-key=${YOUTH_POLICY_API_KEY:}
policy.lh.api-key=${LH_POLICY_API_KEY:}

# Gmail SMTP credentials are supplied only through environment variables.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_SMTP_USERNAME:}
spring.mail.password=${GMAIL_SMTP_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
